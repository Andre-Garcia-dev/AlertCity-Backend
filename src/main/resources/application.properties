spring.application.name=AlertCity-Backend

# --- Servidor ---
server.port=${BACKEND_PORT:8080}

# --- Base de datos (defaults para correr desde el IDE contra el contenedor) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alertcity_db}
spring.datasource.username=${DB_USER:alertcity_admin}
spring.datasource.password=${DB_PASSWORD:alertcity_dbAdmin}

# --- JPA: Flyway es dueño del esquema, Hibernate solo valida ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
