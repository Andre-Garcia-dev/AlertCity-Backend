spring.application.name=AlertCity-Backend

# --- Servidor ---
server.port=${BACKEND_PORT:8080}

# --- Base de datos (defaults para correr desde el IDE contra el contenedor) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alertcity_db}
spring.datasource.username=${DB_USER:alertcity_admin}
spring.datasource.password=${DB_PASSWORD:alertcity_dbAdmin}

# --- JPA: Flyway es dueño del esquema, Hibernate solo valida ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Seguridad JWT (2.1.1) ---
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# --- Evidencias Fotográficas / Multipart (2.5) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads/reports}

# --- OpenAPI / Swagger UI (2.7) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
